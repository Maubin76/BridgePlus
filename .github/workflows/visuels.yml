# Visuels du README et fichiers du logo : génère les icônes à partir du dessin du
# logo (LogoAssetsTest : image de référence, icône Windows, icônes Android), rend
# hors écran la fenêtre du PC, la carte de l'historique et les écrans du téléphone
# avec des données d'exemple (ReadmeScreenshotsTest), puis les pose dans des cadres
# sur un fond gris (ci/vitrines.py). Le résultat, à recopier dans le dépôt, est
# joint à l'exécution (« visuels »).
#
# Sur Windows, pour la police des barres de titre (Segoe UI). Lancé quand le
# rendu, le script ou l'interface changent sur develop, ou à la main depuis
# l'onglet Actions.
name: Visuels du README

on:
  push:
    branches: [develop]
    paths:
      - desktop/src/test/kotlin/fr/maubin/bridgeplus/desktop/ReadmeScreenshotsTest.kt
      - desktop/src/test/kotlin/fr/maubin/bridgeplus/desktop/LogoAssetsTest.kt
      - desktop/src/main/**
      - ui/src/**
      - ci/vitrines.py
      - .github/workflows/visuels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visuels:
    name: Visuels
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Récupérer les polices Satoshi (non versionnées, voir leur licence)"
        shell: bash
        run: bash ci/polices.sh

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Générer le logo et rendre les écrans (hors écran, données d'exemple)
        shell: bash
        run: ./gradlew :desktop:test --tests "*LogoAssetsTest*" --tests "*ReadmeScreenshotsTest*"

      - name: Installer Python et Pillow
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Composer les visuels
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python ci/vitrines.py

      - name: Joindre les visuels, les rendus bruts et les fichiers du logo
        uses: actions/upload-artifact@v7
        with:
          name: visuels
          path: |
            doc/images/
            doc/logo/bridgeplus-logo.png
            desktop/build/captures/readme/
            desktop/icons/bridgeplus.ico
            app/src/main/res/mipmap-*/ic_launcher_*.png
            app/src/main/res/drawable/ic_launcher_monochrome.xml
          retention-days: 14
