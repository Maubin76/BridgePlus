[versions]
agp                   = "9.2.1"
kotlin                = "2.4.20"
composeMultiplatform  = "1.12.1"
composeMaterial3      = "1.9.0"
composeBom            = "2026.09.00"
activityCompose       = "1.13.0"
lifecycle             = "2.11.0"
coreKtx               = "1.19.1"
coroutines            = "1.11.0"
serialization         = "1.11.0"
jna                   = "5.19.1"
zxing                 = "3.5.3"
camerax               = "1.4.2"
junit                 = "4.13.2"

[libraries]
androidx-core-ktx                      = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose              = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose     = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom                   = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui                    = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling            = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3             = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core                = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing               = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
compose-desktop-material3              = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-runtime                        = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation                     = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui                             = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-components-resources           = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
kotlinx-serialization-json             = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
jna-platform                           = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
zxing-core                             = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-camera-camera2                = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle              = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view                   = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
junit                                  = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application   = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library   = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
